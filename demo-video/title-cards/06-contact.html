<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6 · סיום / יצירת קשר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* Bookend closing: same hero slogan as opener + contact CTA */

    .stage {
      gap: clamp(2.2rem, 5.5vh, 4.5rem);
      /* Slight optical nudge - RTL + LTR brand mark read left-heavy when math-centered */
      transform: translateX(12px);
    }

    .brand {
      opacity: 0;
      animation: none;
      /* Brand mark is LTR (text then icon); nudge so its visual weight sits on center */
      margin-inline: auto;
      transform: translateX(6px);
    }

    body.is-ready .brand {
      animation: brandIn 0.8s 0.15s ease-out both;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 1100px;
      margin-inline: auto;
      gap: 0;
    }

    .slogan-hero {
      opacity: 0;
      font-size: clamp(2.4rem, 6.8vmin, 5.6rem);
      justify-content: center;
      width: 100%;
    }

    body.is-ready .slogan-hero {
      opacity: 1;
    }

    body.is-ready .slogan-hero.stagger .phrase {
      opacity: 0;
      animation: phraseIn 0.55s ease-out forwards;
    }

    body.is-ready .slogan-hero.stagger .phrase:nth-child(1) { animation-delay: 0.55s; }
    body.is-ready .slogan-hero.stagger .phrase:nth-child(2) { animation-delay: 0.8s; }
    body.is-ready .slogan-hero.stagger .phrase:nth-child(3) { animation-delay: 1.05s; }

    .cta {
      margin-top: clamp(1.4rem, 3.2vh, 2.2rem);
      font-size: clamp(1.75rem, 3.6vmin, 2.75rem);
      font-weight: 700;
      color: var(--orange);
      opacity: 0;
      text-align: center;
      width: 100%;
    }

    body.is-ready .cta {
      animation: fadeUp 0.6s 1.25s ease-out both;
    }

    .contact-block {
      margin-top: clamp(1rem, 2.4vh, 1.6rem);
      gap: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      opacity: 0;
    }

    body.is-ready .contact-block {
      animation: fadeUp 0.6s 1.45s ease-out both;
    }

    /* 3-column grid: icon | text | mirror - text sits on the true center axis */
    .contact-row {
      display: grid;
      grid-template-columns: 1.5rem auto 1.5rem;
      align-items: center;
      justify-content: center;
      column-gap: 0.55rem;
      margin: 0;
      direction: ltr;
      font-size: clamp(1.25rem, 2.6vmin, 1.85rem);
      font-weight: 500;
      line-height: 1;
      color: var(--ink);
    }

    .contact-icon {
      width: 1.2em;
      height: 1.2em;
      display: block;
      justify-self: end;
    }

    .contact-mirror {
      width: 1.2em;
      height: 1px;
      justify-self: start;
    }

    .contact-icon--mail {
      color: var(--teal);
    }

    .contact-icon--phone {
      color: var(--orange);
    }

    .contact-value {
      font: inherit;
      letter-spacing: 0.01em;
      text-align: center;
      direction: ltr;
      unicode-bidi: isolate;
      justify-self: center;
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateX(6px) translateY(-14px); }
      to { opacity: 1; transform: translateX(6px) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand,
      .slogan-hero,
      .cta,
      .contact-block,
      body.is-ready .slogan-hero.stagger .phrase {
        animation: none !important;
        opacity: 1 !important;
      }

      .brand {
        transform: translateX(6px) !important;
      }

      .stage {
        transform: translateX(12px) !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="brand brand-hero">
      <div class="brand-text">
        <span class="brand-name">Gamify</span>
        <span class="brand-sub">PLATFORM</span>
      </div>
      <img class="brand-logo" src="logo.png" alt="Gamify" />
    </div>

    <div class="content">
      <h1 class="slogan-hero stagger">
        <span class="phrase c-ink">הופכים</span>
        <span class="phrase c-orange">כל אירוע</span>
        <span class="phrase c-teal">למשחק</span>
      </h1>

      <p class="cta">בואו נדבר</p>

      <div class="contact-block">
        <p class="contact-row">
          <svg class="contact-icon contact-icon--mail" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 6.5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/>
            <path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="m3.5 7.5 8.5 6 8.5-6"/>
          </svg>
          <span class="contact-value">ourgamify@gmail.com</span>
          <span class="contact-mirror" aria-hidden="true"></span>
        </p>
        <p class="contact-row">
          <svg class="contact-icon contact-icon--phone" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M6.6 3.8h2.3c.5 0 .9.3 1 .8l.7 2.8c.1.5-.1 1-.5 1.3l-1.4 1.1a12.2 12.2 0 0 0 5.5 5.5l1.1-1.4c.3-.4.8-.6 1.3-.5l2.8.7c.5.1.8.5.8 1v2.3c0 .6-.5 1.1-1.1 1-3.6-.5-7-2.3-9.5-4.8S4.9 9 4.4 5.4c-.1-.6.4-1.1 1-1.1.4 0 .8 0 1.2.4Z"/>
          </svg>
          <span class="contact-value">055-673-8544</span>
          <span class="contact-mirror" aria-hidden="true"></span>
        </p>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      try {
        await document.fonts.ready;
      } catch (_) {}
      requestAnimationFrame(() => {
        document.body.classList.add("is-ready");
      });
    })();
  </script>
</body>
</html>
