<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1 · פתיח / Brand reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="stage">
    <div class="brand">
      <div class="brand-text">
        <span class="brand-name">Gamify</span>
        <span class="brand-sub">PLATFORM</span>
      </div>
      <img class="brand-logo" src="logo.png" alt="Gamify" />
    </div>

    <div class="content">
      <p class="line-main stagger">
        <span class="phrase c-ink">פחות שעמום<span class="dot">•</span></span>
        <span class="phrase c-orange">יותר כיף<span class="dot">•</span></span>
        <span class="phrase c-teal">יותר ביחד</span>
      </p>
    </div>
  </div>
</body>
</html>
