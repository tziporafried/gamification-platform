<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2 · לפני ה-Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="stage">
    <div class="brand">
      <div class="brand-text">
        <span class="brand-name">Gamify</span>
        <span class="brand-sub">PLATFORM</span>
      </div>
      <img class="brand-logo" src="logo.png" alt="Gamify" />
    </div>

    <div class="content">
      <div>
        <h1 class="line-main">הכל מתחיל כאן</h1>
        <p class="line-sub stagger">
          <span class="phrase c-teal">מגדירים<span class="dot">•</span></span>
          <span class="phrase c-orange">מתאימים<span class="dot">•</span></span>
          <span class="phrase c-ink">יוצאים לדרך</span>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
